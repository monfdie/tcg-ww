<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tournament Bracket Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Segoe+UI&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #0b0d17;
            background-image: radial-gradient(circle at 50% 30%, #2b3452 0%, #080a12 85%);
            font-family: 'Segoe UI', sans-serif; color: #fff; padding: 40px; box-sizing: border-box;
        }
        
        .main-container { display: flex; align-items: flex-start; gap: 40px; }

        /* --- КАРТОЧКА СЕТКИ --- */
        .bracket-board {
            width: 1500px; height: 900px; /* Идеальный размер для стрима */
            background: linear-gradient(rgba(10, 12, 20, 0.85), rgba(10, 12, 20, 0.95)), url('/bg.jpg') center/cover;
            border: 2px solid #2a3454; box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 12px; padding: 50px 50px 20px 50px; box-sizing: border-box;
            position: relative; display: flex; flex-direction: column;
            transform-origin: top center;
        }

        .b-header { text-align: center; margin-bottom: 30px; }
        .b-title { font-family: 'Cinzel', serif; font-size: 3.5em; margin: 0; color: #fff; text-shadow: 0 0 20px rgba(212, 175, 55, 0.6); text-transform: uppercase; outline: none; letter-spacing: 2px; }
        .b-subtitle { font-size: 1.2em; color: #8da4c4; letter-spacing: 4px; text-transform: uppercase; font-weight: bold; outline: none; margin-top: 10px; }

        /* --- ДИНАМИЧЕСКАЯ СЕТКА FLEXBOX --- */
        .bracket-layout {
            display: flex; flex-grow: 1; width: 100%; gap: 0;
            margin-bottom: 70px; /* Отодвигает сетку вверх, освобождая место для логотипа */
        }
        
        .b-col {
            flex: 1; display: flex; flex-direction: column;
        }
        
        .b-cell {
            flex: 1; display: flex; align-items: center; justify-content: center; position: relative;
        }

        /* --- КАРТОЧКА МАТЧА (Уменьшена для дистанции между парами) --- */
        .match-card {
            width: 200px; /* Уменьшили ширину */
            background: rgba(16, 20, 32, 0.95);
            border: 1px solid #3c4566; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; position: relative; z-index: 10;
        }
        .p-row {
            display: flex; align-items: center; height: 32px; /* Уменьшили высоту, теперь блоки компактнее */
            border-bottom: 1px solid #2a3454; position: relative;
        }
        .p-row:last-child { border-bottom: none; }
        
        .p-name {
            flex-grow: 1; padding: 0 10px; font-weight: bold; font-size: 0.85em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none;
            transition: 0.3s;
        }
        .p-score {
            width: 35px; height: 100%; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); border-left: 1px solid #2a3454;
            font-family: 'Cinzel', serif; font-weight: bold; font-size: 0.9em; outline: none; color: #fff;
        }
        .p-score:focus { color: #d4af37; background: #000; }

        /* --- КНОПКА ADVANCE (>) --- */
        .btn-adv {
            position: absolute; right: 35px; top: 0; height: 100%; width: 20px;
            background: linear-gradient(90deg, transparent, #4facfe); border: none; color: #fff;
            font-weight: bold; cursor: pointer; opacity: 0; transition: 0.2s; font-size: 1em; padding: 0;
        }
        .p-row:hover .btn-adv { opacity: 1; }
        .btn-adv:hover { background: #4facfe; color: #000; }

        /* --- ИДЕАЛЬНЫЕ СОЕДИНИТЕЛЬНЫЕ ЛИНИИ --- */
        /* Исходящие линии (вправо) */
        .b-col:not(:last-child) .b-cell:nth-child(odd)::before {
            content: ''; position: absolute;
            left: calc(50% + 100px); right: 0; top: 50%; bottom: 0;
            border-top: 2px solid #3c4566; border-right: 2px solid #3c4566; border-top-right-radius: 6px; z-index: 1;
        }
        .b-col:not(:last-child) .b-cell:nth-child(even)::before {
            content: ''; position: absolute;
            left: calc(50% + 100px); right: 0; top: 0; bottom: 50%;
            border-bottom: 2px solid #3c4566; border-right: 2px solid #3c4566; border-bottom-right-radius: 6px; z-index: 1;
        }
        /* Входящие линии (влево) */
        .b-col:not(:first-child) .b-cell::after {
            content: ''; position: absolute;
            left: 0; width: calc(50% - 100px); top: 50%; height: 2px;
            background: #3c4566; z-index: 1;
        }

        /* --- ПАНЕЛЬ УПРАВЛЕНИЯ --- */
        .side-panel { display: flex; flex-direction: column; gap: 20px; width: 300px; flex-shrink: 0; }
        .back-link {
            display: block; text-align: center; padding: 15px; border-radius: 12px; background: rgba(16, 20, 32, 0.8);
            color: #d4af37; text-decoration: none; font-weight: bold; border: 1px solid #3c4566; transition: 0.2s;
        }
        .back-link:hover { background: #2a3454; color: #fff; border-color: #d4af37; }
        
        .controls-box {
            background: rgba(16, 20, 32, 0.8); padding: 20px; border-radius: 12px; border: 1px solid #3c4566;
        }
        .controls-title { margin: 0 0 15px 0; color: #fff; text-transform: uppercase; font-size: 1em; text-align: center; }
        .action-btn {
            flex: 1; background: rgba(42, 52, 84, 0.5); color: #d4af37; border: 1px solid #3c4566;
            padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { background: #d4af37; color: #000; border-color: #d4af37; }
        .action-btn.active { background: #d4af37; color: #000; }

        .instruction {
            background: rgba(16, 20, 32, 0.8); padding: 20px; border-radius: 12px;
            border: 1px solid #3c4566; color: #8da4c4; font-size: 0.95em; line-height: 1.5;
        }

        .download-btn {
            background: linear-gradient(45deg, #d4af37, #f2d06b); color: #000; border: none;
            padding: 20px; border-radius: 12px; font-size: 1.2em; font-weight: bold;
            cursor: pointer; transition: 0.2s; font-family: 'Segoe UI', sans-serif;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); text-transform: uppercase;
        }
        .download-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.6); }
        
        .footer-logo { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 120px; opacity: 0.8; filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="side-panel">
            <a href="/" class="back-link">← BACK TO SITE</a>
            
            <div class="controls-box">
                <h4 class="controls-title">Bracket Size</h4>
                <div style="display: flex; gap: 10px;">
                    <button class="action-btn" id="btn-4" onclick="renderBracket(4)">4</button>
                    <button class="action-btn active" id="btn-8" onclick="renderBracket(8)">8</button>
                    <button class="action-btn" id="btn-16" onclick="renderBracket(16)">16</button>
                </div>
            </div>

            <div class="controls-box">
                <h4 class="controls-title" style="color: #4facfe;">Save / Load</h4>
                <div style="display: flex; gap: 10px;">
                    <button class="action-btn" id="save-btn" style="color: #4facfe; border-color: rgba(79, 172, 254, 0.5);" onclick="saveBracket()">SAVE</button>
                    <button class="action-btn" id="load-btn" style="color: #4facfe; border-color: rgba(79, 172, 254, 0.5);" onclick="loadBracket()">LOAD</button>
                </div>
            </div>

            <div class="instruction">
                <p>1. Впиши ники и счет.</p>
                <p>2. Нажми <b>></b> рядом с ником, чтобы игрок прошел дальше.</p>
                <p>3. Нажми <b>SAVE</b>, чтобы сохранить сетку в браузере.</p>
            </div>
            
            <button class="download-btn" onclick="downloadBracket()" id="dl-btn">Download Bracket</button>
        </div>

        <div class="bracket-board" id="capture-area">
            <div class="b-header">
                <h1 class="b-title" id="tour-title" contenteditable="true">PLAYOFF STAGE</h1>
                <div class="b-subtitle" id="tour-subtitle" contenteditable="true">TOP 8 FINALISTS</div>
            </div>

            <div class="bracket-layout" id="bracket-layout">
                </div>

            <img src="/logo.png" alt="Logo" class="footer-logo" crossorigin="anonymous">
        </div>
    </div>

    <script>
        let currentSize = 8;

        // Функция генерации сетки нужного размера (4, 8, 16)
        function renderBracket(size) {
            currentSize = size;
            document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + size).classList.add('active');
            document.getElementById('tour-subtitle').innerText = `TOP ${size} FINALISTS`;

            const container = document.getElementById('bracket-layout');
            let html = '';
            
            const rounds = Math.log2(size);
            let globalMatchId = 1;
            
            let matchIds = [];
            let numMatches = size / 2;
            for(let r=0; r<rounds; r++) {
                matchIds[r] = [];
                for(let m=0; m<numMatches; m++) {
                    matchIds[r].push(globalMatchId++);
                }
                numMatches /= 2;
            }
            
            for(let r=0; r<rounds; r++) {
                html += `<div class="b-col r${r+1}">`;
                const mIds = matchIds[r];
                
                for(let m=0; m<mIds.length; m++) {
                    const id = mIds[m];
                    const isFinal = (r === rounds - 1);
                    
                    let nextTarget = 'winner';
                    if (!isFinal) {
                        const nextGlobalId = matchIds[r+1][Math.floor(m/2)];
                        const slot = (m % 2 === 0) ? 'p1' : 'p2';
                        nextTarget = `m${nextGlobalId}-${slot}`;
                    }
                    
                    html += `
                    <div class="b-cell">
                        <div class="match-card" ${isFinal ? 'style="border-color: #d4af37; box-shadow: 0 0 20px rgba(212,175,55,0.3);"' : ''}>
                            <div class="p-row">
                                <div class="p-name" id="m${id}-p1" contenteditable="true">TBD</div>
                                <button class="btn-adv" onclick="adv(this, 'm${id}-p1', '${nextTarget}')" title="Advance">></button>
                                <div class="p-score" id="m${id}-p1-score" contenteditable="true">-</div>
                            </div>
                            <div class="p-row">
                                <div class="p-name" id="m${id}-p2" contenteditable="true">TBD</div>
                                <button class="btn-adv" onclick="adv(this, 'm${id}-p2', '${nextTarget}')" title="Advance">></button>
                                <div class="p-score" id="m${id}-p2-score" contenteditable="true">-</div>
                            </div>
                        </div>
                    </div>
                    `;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        // Продвижение игрока
        function adv(btnElement, fromId, toId) {
            const nameNode = document.getElementById(fromId);
            if (!nameNode) return;
            const name = nameNode.innerText;
            
            if (toId === 'winner') {
                const parentCard = nameNode.closest('.match-card');
                parentCard.querySelectorAll('.p-name').forEach(el => {
                    el.style.color = '#fff';
                    el.style.textShadow = 'none';
                });
                nameNode.style.color = '#d4af37';
                nameNode.style.textShadow = '0 0 15px rgba(212,175,55,0.8)';
            } else {
                const target = document.getElementById(toId);
                if (target) {
                    target.innerText = name;
                    target.style.color = '#fff';
                    target.style.textShadow = 'none';
                }
            }
        }

        // Сохранение сетки
        function saveBracket() {
            const data = {
                size: currentSize,
                title: document.getElementById('tour-title').innerText,
                subtitle: document.getElementById('tour-subtitle').innerText,
                names: {},
                scores: {},
                golds: []
            };

            document.querySelectorAll('.p-name').forEach(el => {
                data.names[el.id] = el.innerText;
                // Проверяем, золотой ли ник (победитель)
                if (el.style.color === 'rgb(212, 175, 55)' || el.style.color === '#d4af37') {
                    data.golds.push(el.id);
                }
            });

            document.querySelectorAll('.p-score').forEach(el => {
                data.scores[el.id] = el.innerText;
            });

            localStorage.setItem('gitcg_bracket', JSON.stringify(data));

            const btn = document.getElementById('save-btn');
            const originalText = btn.innerText;
            btn.innerText = 'SAVED!';
            btn.style.background = 'rgba(79, 172, 254, 0.5)';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = 'rgba(42, 52, 84, 0.5)';
            }, 1500);
        }

        // Загрузка сетки
        function loadBracket() {
            const savedData = localStorage.getItem('gitcg_bracket');
            if (!savedData) {
                alert('No saved bracket found!');
                return;
            }

            const data = JSON.parse(savedData);
            
            // 1. Отрисовываем нужный размер
            renderBracket(data.size);

            // 2. Восстанавливаем заголовки
            document.getElementById('tour-title').innerText = data.title || 'PLAYOFF STAGE';
            document.getElementById('tour-subtitle').innerText = data.subtitle || `TOP ${data.size} FINALISTS`;

            // 3. Восстанавливаем ники и снимаем золото
            for (const [id, value] of Object.entries(data.names)) {
                const el = document.getElementById(id);
                if (el) {
                    el.innerText = value;
                    el.style.color = '#fff';
                    el.style.textShadow = 'none';
                }
            }

            // 4. Возвращаем золото победителям
            
            // 5. Восстанавливаем счет
            for (const [id, value] of Object.entries(data.scores)) {
                const el = document.getElementById(id);
                if (el) {
                    el.innerText = value;
                }
            }

            const btn = document.getElementById('load-btn');
            const originalText = btn.innerText;
            btn.innerText = 'LOADED!';
            btn.style.background = 'rgba(79, 172, 254, 0.5)';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = 'rgba(42, 52, 84, 0.5)';
            }, 1500);
        }

        // Скачивание скриншота
        function downloadBracket() {
            window.scrollTo(0, 0); 
            const btn = document.getElementById('dl-btn');
            btn.innerText = 'GENERATING...';
            btn.style.opacity = '0.7';

            const captureArea = document.getElementById('capture-area');
            document.querySelectorAll('[contenteditable]').forEach(el => el.blur());

            html2canvas(captureArea, { 
                scale: 2, 
                useCORS: true, 
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'gitcg_bracket.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerText = 'Download Bracket';
                btn.style.opacity = '1';
            });
        }

        // Запуск (по умолчанию 8 игроков)
        document.addEventListener("DOMContentLoaded", () => {
            renderBracket(8);
        });
    </script>
</body>
</html>
